spring:
  datasource:
    url: jdbc:h2:mem:clinevo;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
clinevo:
  api-key: ""
  ai-service-url: http://localhost:65535
  mail:
    host: ""
logging:
  level:
    root: WARN
