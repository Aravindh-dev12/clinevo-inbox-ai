server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:clinevo}
    password: ${ORACLE_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

clinevo:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  mail-poll-seconds: ${MAIL_POLL_SECONDS:60}
